name: shellcheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      - name: Lint the scripts
        run: |
          shellcheck --version
          shellcheck --severity=warning cortex-control install.sh uninstall.sh tests/*.sh
